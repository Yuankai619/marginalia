[project]
name = "marginalia-server"
version = "0.1.0"
license = "MIT"
description = "Marginalia local backend: ingest, align, transcribe, generate notes, agents"
requires-python = ">=3.12"
dependencies = [
    "av>=12,<16",
    "claude-agent-sdk>=0.2.176",
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "imageio-ffmpeg>=0.8.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "python-multipart>=0.0.33",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
marginalia = "marginalia.cli:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "marginalia"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
